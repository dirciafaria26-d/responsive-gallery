
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Image Gallery</h1>

    <div class="gallery-container">
        <div class="gallery">
            <img src="https://www.w3schools.com/css/img_5terre.jpg" alt="Cinque Terre">
            <p>Cinque Terre</p>
        </div>

        <div class="gallery">
            <img src="https://www.w3schools.com/css/img_forest.jpg" alt="Forest">
            <p>Forest</p>
        </div>

        <div class="gallery">
            <img src="https://www.w3schools.com/css/img_lights.jpg" alt="Northern Lights">
            <p>Northern Lights</p>
        </div>

        <div class="gallery">
            <img src="https://www.w3schools.com/css/img_mountains.jpg" alt="Mountains">
            <p>Mountains</p>
        </div>
    </div>
</body>
</html>
